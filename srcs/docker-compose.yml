services:
  nginx:
    build: ./requirements/nginx
    image: nginx_inception
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress:/var/www/wordpress/
    networks:
      - inception_network

  wordpress:
    build: ./requirements/wordpress
    image: wordpress_inception
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
      - redis
    env_file:
      - .env
    volumes:
      - wordpress:/var/www/wordpress/
    networks:
      - inception_network

  mariadb:
    build: ./requirements/mariadb
    image: mariadb_inception
    container_name: mariadb
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_HOST: ""
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception_network

# BONUS

# _________________________________

  redis:
    build: ./requirements/bonus/redis
    image: redis_inception
    container_name: redis
    restart: always
    networks:
      - inception_network

# _________________________________

volumes:
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ael-ghaz/data/wordpress
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ael-ghaz/data/mariadb

networks:
  inception_network:
    driver: bridge
