services:
  nginx:
    build: ./requirements/nginx
    image: nginx_inception
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./requirements/nginx/html/:/var/www/wordpress/
    networks:
      - inception_network

  wordpress:
    build: ./requirements/wordpress
    image: wordpress_inception
    container_name: wordpress
    restart: always
    env_file:
      - .env
    volumes:
      - ./requirements/nginx/html/:/var/www/wordpress/
    networks:
      - inception_network

  
networks:
  inception_network:
    driver: bridge