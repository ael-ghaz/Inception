services:
  nginx:
    build: ./requirements/nginx
    image: nginx_inception
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - ~/ael-ghaz/data/nginx:/var/www/wordpress/
    networks:
      - inception_network

  wordpress:
    build: ./requirements/wordpress
    image: wordpress_inception
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
    env_file:
      - .env
    volumes:
      - ~/ael-ghaz/data/wordpress:/var/www/wordpress/
    networks:
      - inception_network

  
networks:
  inception_network:
    driver: bridge